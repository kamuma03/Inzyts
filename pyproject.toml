# Tool configuration. Project metadata / dependencies live in requirements.txt.
# Mutmut config is in setup.cfg.

[tool.ruff]
# Cache lives at the default .ruff_cache/ (gitignored). Avoid a shared
# .cache/ parent: a root-running container created it root-owned, so a
# non-root dev couldn't write to it (pytest/ruff/mypy all failed silently).

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "socketio.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Cache lives at the default .pytest_cache/ (gitignored) — see the [tool.ruff]
# note above for why we don't consolidate under a shared .cache/ parent.
# Default: skip integration / e2e / UI suites AND the `slow` marker.
# `slow` covers tests that spawn real Jupyter kernels (test_sandbox_security.py).
# Those exercise setrlimit / setsid / killpg machinery on real subprocesses —
# a failed setsid in the child historically caused os.killpg() to SIGKILL the
# *parent* process group, which can take the test runner / shell / terminal /
# desktop session down with it. Opt in explicitly with `pytest -m slow` only
# after reading the safety guarantees in src/services/sandbox_executor.py.
addopts = "--ignore=tests/ui --ignore=tests/integration --ignore=tests/e2e -m 'not slow'"
# Per-test wall-clock cap: a hung or accidentally-real-kernel test fails in
# seconds instead of dominating the suite (a mocked validator that secretly
# span up a real kernel once stretched the suite to ~40 min). `thread` method
# (vs the default `signal`) avoids interfering with the sandbox's own
# setsid/SIGALRM machinery. Slow real-kernel tests opt out via
# `@pytest.mark.timeout(0)` or run under `-m slow`.
timeout = 120
timeout_method = "thread"
markers = [
    "requires_redis: tests that need a running Redis instance",
    "requires_db: tests that need a real PostgreSQL database (via testcontainers)",
    "requires_docker: tests that need a Docker daemon (testcontainers, etc.)",
    "slow: tests that spawn real Jupyter kernels — opt in with `pytest -m slow`",
]
